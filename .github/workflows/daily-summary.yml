name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动运行（UTC时间）
  workflow_dispatch: # 允许你手动点击按钮测试

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔑 钥匙检测 (OpenAI & Telegram)
        env:
          OA_KEY: ${{ secrets.OPENAI_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$OA_KEY" ]; then
            echo "❌ 警告：未检测到 OPENAI_API_KEY"
            exit 1
          else
            echo "✅ OpenAI 钥匙就绪 (长度: ${#OA_KEY})"
          fi
          
          if [ -z "$TG_TOKEN" ]; then
            echo "❌ 警告：未检测到 TELEGRAM_BOT_TOKEN，手机将无法收到消息"
            exit 1
          else
            echo "✅ Telegram 钥匙就绪 (长度: ${#TG_TOKEN})"
          fi

      - name: 🌐 网络连通性测试
        run: |
          echo "正在测试网络..."
          curl -I https://api.openai.com/v1/models && echo "✅ OpenAI 连通" || echo "❌ OpenAI 不连通"
          curl -I https://api.telegram.org && echo "✅ Telegram 连通" || echo "❌ Telegram 不连通"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # --hours 48 确保能抓到近两天的内容，防止漏掉
        run: uv run horizon --hours 48

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
