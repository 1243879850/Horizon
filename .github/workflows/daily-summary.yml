name: Daily Horizon Summary

on:
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔑 钥匙检测
        env:
          TEST_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$TEST_KEY" ]; then
            echo "❌ 警告：GitHub 没拿到 ANTHROPIC_API_KEY！"
            exit 1
          else
            echo "✅ 成功：已识别到钥匙，长度为 ${#TEST_KEY} 个字符。"
          fi

      - name: 🌐 网络连通性测试
        run: |
          echo "正在测试是否能连接到 Anthropic 服务器..."
          curl -I https://api.anthropic.com/v1/messages && echo "✅ 网络连接正常" || echo "❌ 无法访问服务器"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run horizon --hours 48
