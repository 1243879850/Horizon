name: Daily Horizon Summary

on:
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔑 OpenAI 钥匙检测
        env:
          TEST_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$TEST_KEY" ]; then
            echo "❌ 警告：GitHub 没拿到 OPENAI_API_KEY，请检查 Secrets 设置！"
            exit 1
          else
            echo "✅ 成功：已识别到 OpenAI 钥匙，长度为 ${#TEST_KEY} 个字符。"
          fi

      - name: 🌐 网络连通性测试 (OpenAI)
        run: |
          echo "正在测试是否能连接到 OpenAI 服务器..."
          curl -I https://api.openai.com/v1/models && echo "✅ 网络连接正常" || echo "❌ 无法访问 OpenAI 服务器"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          # 核心修改：这里必须叫 OPENAI_API_KEY，才能和你的 config.json 对应上
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run horizon --hours 48

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
